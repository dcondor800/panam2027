<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lima 2027 - Juegos PanAm y Parapan</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <!-- ============================================================
       Contenedor del poster.
       Ajusta el margen superior / ancho desde assets/styles.css
       (variables --margen-superior, --poster-ancho, --poster-w/h).
       ============================================================ -->
  <div class="escena">
    <div class="poster">

      <!-- Imagen de fondo (no interactiva) -->
      <img class="poster__img"
           src="assets/poster.png"
           alt="Lima 2027 - Juegos PanAm y Parapan"
           draggable="false">

      <!-- Zona interactiva: arrastrar (1 dedo) y pellizcar para zoom (2 dedos).
           Su posicion va en % sobre la imagen, definida en styles.css -->
      <div class="poster__zona" id="zona">
        <div class="poster__contenido" id="contenido"></div>
      </div>

    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
